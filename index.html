<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Offline AI - A fully private, local-first LLM chat interface running in-browser using WebGPU and GGUF model formats." />
    <title>Offline AI - Private Sandbox</title>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:9999;padding:20px;"><b>ERROR:</b> ' + msg + '<br>' + error?.stack + '</div>';
      };
      window.onunhandledrejection = function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;z-index:9999;padding:20px;"><b>PROMISE ERROR:</b> ' + e.reason + '</div>';
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
